name: Refresh free-model roster

# Runs daily. The roster refresh needs no key (public catalog).
# The health check needs the OPENROUTER_API_KEY repository secret;
# without it, scripts/healthcheck.py records "skipped" and exits 0.
on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh roster
        run: python3 scripts/refresh.py
      - name: Health check (budgeted probes)
        if: ${{ secrets.OPENROUTER_API_KEY != '' }}
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PROBE_COUNT: "5"
        run: python3 scripts/healthcheck.py
      - name: Commit data updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "data: daily roster refresh + health check"
            git push
          fi
